<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Sun Ro Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0077b6; --cyan: #00b4d8; --dark: #03045e;
      --pale: #f0f9ff; --gray: #64748b; --white: #fff;
      --shadow: 0 4px 24px rgba(0,119,182,0.10);
    }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }

    /* ===== LOGIN GATE ===== */
    #loginGate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      box-shadow: var(--shadow); width: 100%; max-width: 380px; text-align: center;
    }
    .login-box img { height: 72px; margin-bottom: 10px; }
    .login-box h2 { font-size: 1.4rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
    .login-box p  { font-size: .9rem; color: var(--gray); margin-bottom: 28px; }
    .login-box input {
      width: 100%; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 12px 14px; font-size: 1rem; font-family: inherit;
      outline: none; margin-bottom: 14px; background: #f8fafc;
    }
    .login-box input:focus { border-color: var(--blue); background: #fff; }
    .login-box button {
      width: 100%; background: var(--blue); color: #fff; border: none;
      border-radius: 10px; padding: 13px; font-size: 1rem; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: background .2s;
    }
    .login-box button:hover { background: var(--dark); }
    .login-error {
      display: none; margin-top: 12px; background: #fee2e2; color: #991b1b;
      padding: 10px; border-radius: 8px; font-size: .9rem;
    }

    /* ===== DASHBOARD ===== */
    #dashboard { display: none; }

    .topbar {
      background: var(--dark); color: #fff; padding: 0 28px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-brand { display: flex; align-items: center; gap: 12px; font-size: 1.05rem; font-weight: 700; }
    .topbar-brand img { height: 42px; width: auto; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .btn-logout {
      background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); padding: 6px 16px;
      border-radius: 8px; font-family: inherit; cursor: pointer;
      font-size: .9rem; transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    .page-inner { max-width: 1280px; margin: 0 auto; padding: 28px 20px; }

    /* ===== STATS ROW ===== */
    .stats-row {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 14px; margin-bottom: 24px;
    }
    @media (max-width: 800px) { .stats-row { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 500px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

    .stat-card {
      background: #fff; border-radius: 14px; padding: 18px 20px;
      box-shadow: var(--shadow); border-left: 4px solid var(--blue);
    }
    .stat-card.svc   { border-color: #0077b6; }
    .stat-card.enq   { border-color: #7c3aed; }
    .stat-card.pend  { border-color: #f59e0b; }
    .stat-card.prog  { border-color: #3b82f6; }
    .stat-card.res   { border-color: #22c55e; }
    .stat-card .num  { font-size: 1.9rem; font-weight: 800; color: var(--dark); }
    .stat-card .lbl  { font-size: .82rem; color: var(--gray); font-weight: 600; margin-top: 2px; }

    /* ===== TABS ===== */
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab-btn {
      padding: 10px 22px; border-radius: 10px 10px 0 0;
      border: none; font-family: inherit; font-size: .95rem; font-weight: 600;
      cursor: pointer; background: #e2e8f0; color: var(--gray);
      transition: background .2s, color .2s;
    }
    .tab-btn.active { background: #fff; color: var(--dark); box-shadow: 0 -2px 8px rgba(0,0,0,0.06); }
    .tab-badge {
      display: inline-block; background: var(--blue); color: #fff;
      font-size: .72rem; font-weight: 700; padding: 1px 8px;
      border-radius: 999px; margin-left: 6px; vertical-align: middle;
    }
    .tab-badge.enq-badge { background: #7c3aed; }

    /* ===== CONTROLS ===== */
    .controls {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .controls input {
      flex: 1; min-width: 200px; border: 1px solid #cbd5e1; border-radius: 10px;
      padding: 10px 14px; font-size: .95rem; font-family: inherit;
      outline: none; background: #fff;
    }
    .controls input:focus { border-color: var(--blue); }
    .controls select {
      border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 14px;
      font-size: .95rem; font-family: inherit; outline: none;
      background: #fff; cursor: pointer;
    }
    .btn-clear {
      background: #fee2e2; color: #991b1b; border: none; border-radius: 10px;
      padding: 10px 16px; font-size: .9rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background .2s; white-space: nowrap;
    }
    .btn-clear:hover { background: #fca5a5; }

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
    thead { background: var(--dark); color: #fff; }
    thead th { padding: 13px 14px; text-align: left; font-size: .83rem; font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 14px; font-size: .86rem; color: #334155; vertical-align: top; }
    .td-name { font-weight: 700; color: var(--dark); }
    .td-phone a { color: var(--blue); text-decoration: none; }
    .td-phone a:hover { text-decoration: underline; }
    .td-date { white-space: nowrap; }
    .td-msg { max-width: 200px; word-break: break-word; color: var(--gray); font-size: .82rem; }

    /* Status badges */
    .status-badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap; }
    .s-New        { background: #ede9fe; color: #5b21b6; }
    .s-Pending    { background: #fef3c7; color: #92400e; }
    .s-InProgress { background: #dbeafe; color: #1e40af; }
    .s-Resolved   { background: #dcfce7; color: #166534; }
    .s-Closed     { background: #f1f5f9; color: #64748b; }

    /* Action buttons */
    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-act {
      border: none; border-radius: 7px; padding: 4px 10px;
      font-size: .76rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: opacity .2s;
    }
    .btn-act:hover { opacity: .8; }
    .btn-new      { background: #ede9fe; color: #5b21b6; }
    .btn-prog     { background: #dbeafe; color: #1e40af; }
    .btn-res      { background: #dcfce7; color: #166534; }
    .btn-close    { background: #f1f5f9; color: #64748b; }
    .btn-del      { background: #fee2e2; color: #991b1b; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 64px 20px; background: #fff;
      border-radius: 14px; box-shadow: var(--shadow);
    }
    .empty-state .ei { font-size: 3rem; margin-bottom: 12px; }
    .empty-state h3 { font-size: 1.2rem; color: var(--dark); margin-bottom: 6px; }
    .empty-state p  { font-size: .9rem; color: var(--gray); }
    .empty-state a  {
      display: inline-block; margin-top: 18px; background: var(--blue); color: #fff;
      padding: 11px 24px; border-radius: 10px; font-weight: 600;
      text-decoration: none; font-size: .95rem;
    }

    .back-link { display: inline-block; margin-top: 24px; color: var(--blue); font-size: .9rem; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- ===== LOGIN GATE ===== -->
  <div id="loginGate">
    <div class="login-box">
      <img src="logo.svg" alt="Sun Ro Systems" />
      <h2>Sun Ro Systems</h2>
      <p>Admin Panel — Enter password to continue</p>
      <input type="password" id="adminPass" placeholder="Admin password"
             onkeydown="if(event.key==='Enter') doLogin()" />
      <button onclick="doLogin()">Login</button>
      <div class="login-error" id="loginError">Incorrect password. Please try again.</div>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="dashboard">
    <div class="topbar">
      <div class="topbar-brand">
        <img src="logo.svg" alt="Sun Ro Systems" />
        Admin Panel
      </div>
      <div class="topbar-right">
        <button class="btn-logout" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="page-inner">

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card svc">
          <div class="num" id="statSvc">0</div>
          <div class="lbl">Service Requests</div>
        </div>
        <div class="stat-card enq">
          <div class="num" id="statEnq">0</div>
          <div class="lbl">Enquiries</div>
        </div>
        <div class="stat-card pend">
          <div class="num" id="statPend">0</div>
          <div class="lbl">Pending / New</div>
        </div>
        <div class="stat-card prog">
          <div class="num" id="statProg">0</div>
          <div class="lbl">In Progress</div>
        </div>
        <div class="stat-card res">
          <div class="num" id="statRes">0</div>
          <div class="lbl">Resolved / Closed</div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tabSvcBtn" onclick="switchTab('svc')">
          🔧 Service Requests <span class="tab-badge" id="badgeSvc">0</span>
        </button>
        <button class="tab-btn" id="tabEnqBtn" onclick="switchTab('enq')">
          📩 Enquiries <span class="tab-badge enq-badge" id="badgeEnq">0</span>
        </button>
      </div>

      <!-- Controls -->
      <div class="controls">
        <input type="text" id="searchBox" placeholder="Search by name, phone…" oninput="renderActive()" />
        <select id="filterStatus" onchange="renderActive()">
          <option value="">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="New">New</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Closed">Closed</option>
        </select>
        <button class="btn-clear" onclick="clearActive()">🗑 Clear All</button>
      </div>

      <div class="table-wrap" id="tableWrap"></div>
      <a href="index.html" class="back-link">← Back to Website</a>
    </div>
  </div>

  <script>
    const PASS     = 'sunro@2025';
    const SVC_KEY  = 'sunro_service_requests';
    const ENQ_KEY  = 'sunro_enquiries';
    let activeTab  = 'svc';

    /* ── Auth ── */
    function doLogin() {
      if (document.getElementById('adminPass').value === PASS) {
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        refreshAll();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }
    function doLogout() {
      document.getElementById('loginGate').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('adminPass').value = '';
      document.getElementById('loginError').style.display = 'none';
    }

    /* ── Data helpers ── */
    function getSvc() { return JSON.parse(localStorage.getItem(SVC_KEY) || '[]'); }
    function getEnq() { return JSON.parse(localStorage.getItem(ENQ_KEY) || '[]'); }
    function saveSvc(d) { localStorage.setItem(SVC_KEY, JSON.stringify(d)); }
    function saveEnq(d) { localStorage.setItem(ENQ_KEY, JSON.stringify(d)); }

    /* ── Tab switch ── */
    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tabSvcBtn').classList.toggle('active', tab === 'svc');
      document.getElementById('tabEnqBtn').classList.toggle('active', tab === 'enq');
      document.getElementById('searchBox').value = '';
      document.getElementById('filterStatus').value = '';
      renderActive();
    }
    function renderActive() { activeTab === 'svc' ? renderSvc() : renderEnq(); }

    /* ── Stats refresh ── */
    function refreshAll() {
      const svc = getSvc(), enq = getEnq(), all = [...svc, ...enq];
      document.getElementById('statSvc').textContent  = svc.length;
      document.getElementById('statEnq').textContent  = enq.length;
      document.getElementById('badgeSvc').textContent = svc.length;
      document.getElementById('badgeEnq').textContent = enq.length;
      document.getElementById('statPend').textContent =
        all.filter(r => r.status === 'Pending' || r.status === 'New').length;
      document.getElementById('statProg').textContent =
        all.filter(r => r.status === 'In Progress').length;
      document.getElementById('statRes').textContent  =
        all.filter(r => r.status === 'Resolved' || r.status === 'Closed').length;
      renderActive();
    }

    /* ── Status update & delete ── */
    function updateSvcStatus(id, s) { saveSvc(getSvc().map(r => r.id===id ? {...r, status:s} : r)); refreshAll(); }
    function updateEnqStatus(id, s) { saveEnq(getEnq().map(r => r.id===id ? {...r, status:s} : r)); refreshAll(); }
    function deleteSvc(id) { if(!confirm('Delete this request?')) return; saveSvc(getSvc().filter(r=>r.id!==id)); refreshAll(); }
    function deleteEnq(id) { if(!confirm('Delete this enquiry?')) return; saveEnq(getEnq().filter(r=>r.id!==id)); refreshAll(); }

    function clearActive() {
      const msg = activeTab==='svc' ? 'Delete ALL service requests?' : 'Delete ALL enquiries?';
      if (!confirm(msg + ' This cannot be undone.')) return;
      if (activeTab==='svc') localStorage.removeItem(SVC_KEY);
      else localStorage.removeItem(ENQ_KEY);
      refreshAll();
    }

    /* ── Shared filter logic ── */
    function filtered(all, fields) {
      const search = document.getElementById('searchBox').value.toLowerCase();
      const fs     = document.getElementById('filterStatus').value;
      return all.filter(r => {
        const matchS = !search || fields.some(f => String(r[f]||'').toLowerCase().includes(search));
        const matchF = !fs || r.status === fs;
        return matchS && matchF;
      });
    }

    /* ── Service Requests table ── */
    function renderSvc() {
      const all  = getSvc();
      const rows = filtered(all, ['name','phone','address','problemType','email']);
      const wrap = document.getElementById('tableWrap');

      if (rows.length === 0) {
        wrap.innerHTML = emptyState(all.length === 0,
          'No service requests yet',
          'When a customer submits a service request it will appear here.',
          'index.html#service');
        return;
      }

      const sc = s => s.replace(' ','');
      const btns = r => {
        const b = [];
        if (r.status !== 'In Progress') b.push(`<button class="btn-act btn-prog" onclick="updateSvcStatus(${r.id},'In Progress')">In Progress</button>`);
        if (r.status !== 'Resolved')    b.push(`<button class="btn-act btn-res"  onclick="updateSvcStatus(${r.id},'Resolved')">Resolved</button>`);
        if (r.status !== 'Pending')     b.push(`<button class="btn-act"           onclick="updateSvcStatus(${r.id},'Pending')" style="background:#fef3c7;color:#92400e">Pending</button>`);
        b.push(`<button class="btn-act btn-del" onclick="deleteSvc(${r.id})">Delete</button>`);
        return b.join('');
      };

      wrap.innerHTML = `
        <table>
          <thead><tr>
            <th>#</th><th>Date Submitted</th><th>Customer</th><th>Phone</th>
            <th>Address</th><th>Machine</th><th>Problem</th>
            <th>Pref. Date</th><th>Description</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${rows.map((r,i) => `
              <tr>
                <td>${i+1}</td>
                <td class="td-date">${h(r.submittedAt)}</td>
                <td class="td-name">${h(r.name)}<br/><small style="color:var(--gray);font-weight:400">${h(r.email)}</small></td>
                <td class="td-phone"><a href="tel:${r.phone}">${h(r.phone)}</a></td>
                <td>${h(r.address)}</td>
                <td>${h(r.machineType)}<br/><small style="color:var(--gray)">${h(r.model)}</small></td>
                <td>${h(r.problemType)}</td>
                <td class="td-date">${r.preferredDate||'—'}</td>
                <td class="td-msg">${h(r.description)}</td>
                <td><span class="status-badge s-${sc(r.status)}">${r.status}</span></td>
                <td><div class="actions">${btns(r)}</div></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    /* ── Enquiries table ── */
    function renderEnq() {
      const all  = getEnq();
      const rows = filtered(all, ['name','phone','email','enquiryType','message']);
      const wrap = document.getElementById('tableWrap');

      if (rows.length === 0) {
        wrap.innerHTML = emptyState(all.length === 0,
          'No enquiries yet',
          'When a customer submits the contact form it will appear here.',
          'index.html#contact');
        return;
      }

      const sc = s => s.replace(' ','');
      const btns = r => {
        const b = [];
        if (r.status !== 'In Progress') b.push(`<button class="btn-act btn-prog"  onclick="updateEnqStatus(${r.id},'In Progress')">In Progress</button>`);
        if (r.status !== 'Resolved')    b.push(`<button class="btn-act btn-res"   onclick="updateEnqStatus(${r.id},'Resolved')">Resolved</button>`);
        if (r.status !== 'Closed')      b.push(`<button class="btn-act btn-close" onclick="updateEnqStatus(${r.id},'Closed')">Close</button>`);
        if (r.status !== 'New')         b.push(`<button class="btn-act btn-new"   onclick="updateEnqStatus(${r.id},'New')" style="background:#ede9fe;color:#5b21b6">New</button>`);
        b.push(`<button class="btn-act btn-del" onclick="deleteEnq(${r.id})">Delete</button>`);
        return b.join('');
      };

      wrap.innerHTML = `
        <table>
          <thead><tr>
            <th>#</th><th>Date Submitted</th><th>Customer</th><th>Phone</th>
            <th>Email</th><th>Enquiry Type</th><th>Message</th>
            <th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody>
            ${rows.map((r,i) => `
              <tr>
                <td>${i+1}</td>
                <td class="td-date">${h(r.submittedAt)}</td>
                <td class="td-name">${h(r.name)}</td>
                <td class="td-phone"><a href="tel:${r.phone}">${h(r.phone)}</a></td>
                <td><a href="mailto:${r.email}" style="color:var(--blue);text-decoration:none">${h(r.email)}</a></td>
                <td>${h(r.enquiryType)}</td>
                <td class="td-msg">${h(r.message)}</td>
                <td><span class="status-badge s-${sc(r.status)}">${r.status}</span></td>
                <td><div class="actions">${btns(r)}</div></td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }

    function emptyState(isEmpty, title, desc, link) {
      return `<div class="empty-state">
        <div class="ei">${isEmpty ? '📋' : '🔍'}</div>
        <h3>${isEmpty ? title : 'No results found'}</h3>
        <p>${isEmpty ? desc : 'Try adjusting your search or filter.'}</p>
        ${isEmpty ? `<a href="${link}">Go to Form</a>` : ''}
      </div>`;
    }

    function h(str) {
      return String(str||'')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
